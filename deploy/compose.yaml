# Single-host reference deployment. No service is started by editing this file.
# `up` applies migrations: obtain release approval and a consistent backup first.
x-runtime: &runtime
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &runtime-environment
    DJANGO_SETTINGS_MODULE: config.settings.production
    SJIA_ENVIRONMENT: ${SJIA_ENVIRONMENT:?运行环境未配置}
    SJIA_FILE_OBJECT_ROOT: /var/lib/sjia/objects
    SJIA_CONFIG_EVIDENCE_ROOT: /var/lib/sjia/config-evidence
    SJIA_CONFIG_EVIDENCE_MAX_BYTES: ${SJIA_CONFIG_EVIDENCE_MAX_BYTES:?配置依据读取上限未确认}
    SJIA_SECRET_KEY: ${SJIA_SECRET_KEY:?密钥未配置}
    SJIA_ALLOWED_HOSTS: ${SJIA_ALLOWED_HOSTS:?域名未配置}
    SJIA_TRUST_PROXY_TLS: ${SJIA_TRUST_PROXY_TLS:?请确认私有API代理拓扑后显式设置1或0}
    SJIA_DB_HOST: postgres
    SJIA_DB_PORT: "5432"
    SJIA_DB_NAME: sjia
    SJIA_DB_USER: sjia
    SJIA_DB_PASSWORD: ${SJIA_DB_PASSWORD:?数据库密码未配置}
    SJIA_REDIS_URL: redis://redis:6379/0
    SJIA_CELERY_BROKER_URL: redis://redis:6379/0
    SJIA_OTEL_EXPORT_ENABLED: ${SJIA_OTEL_EXPORT_ENABLED:-0}
    SJIA_OTEL_SAMPLE_RATIO: ${SJIA_OTEL_SAMPLE_RATIO:-0.1}
    SJIA_OTEL_TRACES_ENDPOINT: ${SJIA_OTEL_TRACES_ENDPOINT:-}
  volumes: &runtime-volumes
    - fileobjects:/var/lib/sjia/objects
    - &config-evidence
      type: bind
      source: ${SJIA_CONFIG_EVIDENCE_DIRECTORY:?配置依据目录未提供}
      target: /var/lib/sjia/config-evidence
      read_only: true
      bind:
        create_host_path: false
  depends_on: &runtime-dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sjia
      POSTGRES_USER: sjia
      POSTGRES_PASSWORD: ${SJIA_DB_PASSWORD:?数据库密码未配置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjia -d sjia"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    tmpfs:
      - /run/sjia-metrics
    healthcheck:
      test: ["CMD", "python", "/app/deploy/probe_runtime.py", "liveness"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Queue names exactly match tasks.dispatcher.publish_task and Beat options.
  worker:
    <<: *runtime
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=warning", "--hostname=default@%h", "--queues=default", "--concurrency=${SJIA_DEFAULT_WORKER_CONCURRENCY:-1}"]
    mem_limit: ${SJIA_WORKER_MEMORY_LIMIT:?Worker内存上限未确认}
  worker-purpose:
    <<: *runtime
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=warning", "--hostname=purpose@%h", "--queues=purpose", "--concurrency=${SJIA_PURPOSE_WORKER_CONCURRENCY:-1}"]
    mem_limit: ${SJIA_WORKER_MEMORY_LIMIT:?Worker内存上限未确认}
  worker-assessment:
    <<: *runtime
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=warning", "--hostname=assessment@%h", "--queues=assessment", "--concurrency=${SJIA_ASSESSMENT_WORKER_CONCURRENCY:-1}"]
    mem_limit: ${SJIA_WORKER_MEMORY_LIMIT:?Worker内存上限未确认}
  worker-notification:
    <<: *runtime
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=warning", "--hostname=notification@%h", "--queues=notification", "--concurrency=${SJIA_NOTIFICATION_WORKER_CONCURRENCY:-1}"]
    mem_limit: ${SJIA_WORKER_MEMORY_LIMIT:?Worker内存上限未确认}

  beat:
    <<: *runtime
    # Exactly one Beat instance per database. Never run this in a restore copy.
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=warning", "--schedule=/var/lib/sjia/beat/celerybeat-schedule"]
    volumes:
      - beatdata:/var/lib/sjia/beat
      - *config-evidence

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    volumes:
      - type: bind
        source: ${SJIA_TLS_CERTIFICATE_FILE:?请提供已批准证书的文件路径}
        target: /etc/nginx/certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SJIA_TLS_PRIVATE_KEY_FILE:?请提供已批准密钥的文件路径}
        target: /etc/nginx/certs/server.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "443:443"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  fileobjects:
  beatdata:
